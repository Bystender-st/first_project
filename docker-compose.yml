
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  web:
    build: .
    command: bash -c "python src/wait_for_db.py && python src/manage.py migrate && python src/manage.py runserver 0.0.0.0:9000"
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      - db
  tests:
    build: .
    working_dir: /app/src
    command: bash -c "python wait_for_db.py && python manage.py migrate --noinput && pytest -q"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    environment:
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}

volumes:
  postgres_data:
